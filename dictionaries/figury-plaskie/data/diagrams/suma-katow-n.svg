<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Suma kątów sześciokąta">
  <rect width="320" height="200" fill="#fff"/>

  <polygon points="160,25 250,70 250,150 160,185 70,150 70,70" fill="#FFF9C4" stroke="#F9A825" stroke-width="3"/>
  <text x="160" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#263238">n = 6</text>
  <text x="160" y="195" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#263238">suma = (n−2)·180° = 720°</text>

</svg>

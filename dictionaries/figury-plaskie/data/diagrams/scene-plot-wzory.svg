<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Wzory na obwód jak siatka na płot">
  <rect width="640" height="250" rx="18" fill="#FFF8E1"/>
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#6A32A0">Chcę kupić siatkę na cały płot</text>
  <rect x="70" y="90" width="90" height="70" fill="#FFE0B2" stroke="#FF9800" stroke-width="2"/>
  <polygon points="70,90 115,55 160,90" fill="#EF9A9A" stroke="#E53935" stroke-width="2"/>
  <rect x="100" y="120" width="28" height="40" fill="#90CAF9" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="200" y="70" width="100" height="100" fill="none" stroke="#00BCD4" stroke-width="5" stroke-dasharray="8 5"/>
  <text x="250" y="55" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#00838F">kwadrat</text>
  <text x="250" y="125" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="18" font-weight="900" fill="#6A32A0">O = 4 · a</text>
  <text x="250" y="190" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#546E7A">4 równe boki</text>
  <rect x="360" y="80" width="160" height="80" fill="none" stroke="#43A047" stroke-width="5" stroke-dasharray="8 5"/>
  <text x="440" y="65" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#2E7D32">prostokąt</text>
  <text x="440" y="125" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" font-weight="900" fill="#6A32A0">O = 2 · (a + b)</text>
  <text x="440" y="190" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#546E7A">2 długości + 2 szerokości</text>
  <rect x="40" y="210" width="560" height="28" rx="8" fill="#6A32A0"/>
  <text x="320" y="229" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#fff">Obwód = długość całego płotu (siatki)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Boki i wierzchołki z patyczków">
  <rect width="640" height="250" rx="18" fill="#F3E5F5"/>
  <g transform="translate(80,40)">
    <line x1="140" y1="20" x2="40" y2="180" stroke="#8D6E63" stroke-width="14" stroke-linecap="round"/>
    <line x1="140" y1="20" x2="240" y2="180" stroke="#A1887F" stroke-width="14" stroke-linecap="round"/>
    <line x1="40" y1="180" x2="240" y2="180" stroke="#6D4C41" stroke-width="14" stroke-linecap="round"/>
    <circle cx="140" cy="20" r="12" fill="#6A32A0" stroke="#fff" stroke-width="3"/>
    <circle cx="40" cy="180" r="12" fill="#6A32A0" stroke="#fff" stroke-width="3"/>
    <circle cx="240" cy="180" r="12" fill="#6A32A0" stroke="#fff" stroke-width="3"/>
    <text x="140" y="8" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#6A32A0">A</text>
    <text x="28" y="205" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#6A32A0">B</text>
    <text x="252" y="205" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#6A32A0">C</text>
  </g>
  <g font-family="Segoe UI,sans-serif">
    <rect x="380" y="55" width="220" height="48" rx="10" fill="#fff" stroke="#00BCD4" stroke-width="2"/>
    <circle cx="404" cy="79" r="10" fill="#6A32A0"/>
    <text x="430" y="75" font-size="13" font-weight="800" fill="#6A32A0">wierzchołek</text>
    <text x="430" y="92" font-size="11" fill="#546E7A">miejsce połączenia</text>
    <rect x="380" y="125" width="220" height="48" rx="10" fill="#fff" stroke="#FF9800" stroke-width="2"/>
    <line x1="392" y1="149" x2="416" y2="149" stroke="#8D6E63" stroke-width="8" stroke-linecap="round"/>
    <text x="430" y="145" font-size="13" font-weight="800" fill="#EF6C00">bok</text>
    <text x="430" y="162" font-size="11" fill="#546E7A">patyczek między rogami</text>
    <text x="490" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#6A32A0">3 boki = 3 wierzchołki</text>
  </g>

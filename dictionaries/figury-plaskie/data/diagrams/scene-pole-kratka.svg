<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Pole jako kratka">
  <rect width="640" height="200" rx="18" fill="#E8F5E9"/>
  <g transform="translate(60,30)">
    <rect x="0" y="0" width="250" height="150" fill="#C8E6C9" stroke="#43A047" stroke-width="3"/>
    <line x1="50" y1="0" x2="50" y2="150" stroke="#81C784" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="#81C784" stroke-width="1.5"/>
    <line x1="150" y1="0" x2="150" y2="150" stroke="#81C784" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="200" y2="150" stroke="#81C784" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="250" y2="50" stroke="#81C784" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="250" y2="100" stroke="#81C784" stroke-width="1.5"/>
  </g>
  <rect x="360" y="40" width="240" height="120" rx="14" fill="#fff" stroke="#43A047" stroke-width="3"/>
  <text x="480" y="85" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" font-weight="900" fill="#2E7D32">POLE</text>
  <text x="480" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#546E7A">ile kwadratów</text>
  <text x="480" y="130" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#546E7A">mieści się w środku</text>
  <text x="185" y="195" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#EF6C00">1 kratka = 1 cm²</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f5efe3"/>
  <rect x="24" y="20" width="912" height="380" rx="18" fill="#fffef7" stroke="#e7e0d2" stroke-width="2"/>
  <text x="480" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1c1917">Trójkąty ze względu na kąty</text>

  <!-- acute -->
  <polygon points="160,100 70,280 250,280" fill="#fecaca" fill-opacity="0.85" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
  <text x="160" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#dc2626">ostrokątny</text>
  <text x="160" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#78716c">wszystkie kąty &lt; 90°</text>

  <!-- right -->
  <polygon points="400,100 400,280 620,280" fill="#ccfbf1" fill-opacity="0.9" stroke="#0f766e" stroke-width="4" stroke-linejoin="round"/>
  <rect x="400" y="252" width="28" height="28" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="510" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#0f766e">prostokątny</text>
  <text x="510" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#78716c">1 kąt prosty + 2 ostre</text>

  <!-- obtuse -->
  <polygon points="720,140 660,280 880,280" fill="#fed7aa" fill-opacity="0.9" stroke="#ea580c" stroke-width="4" stroke-linejoin="round"/>
  <text x="770" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ea580c">rozwartokątny</text>
  <text x="770" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#78716c">1 kąt rozwarty + 2 ostre</text>
</svg>

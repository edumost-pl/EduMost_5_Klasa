<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan lekcji — 5a / Розклад уроків — 5a</title>
  <link rel="stylesheet" href="css/schedule.css?v=times1">
</head>
<body>
<div class="hub">
  <a href="index.html" class="back-link" id="backLink">← EduMost · Головна</a>

  <header class="hub-header">
    <h1 id="mainTitle">Plan lekcji — klasa 5a</h1>
    <p class="sub" id="mainSub">Szkoła Podstawowa nr 3, Poznań · sala 27</p>
  </header>

  <div class="lang-toggle">
    <button id="btnPL" class="active" onclick="setLang('pl')">🇵🇱 Polski</button>
    <button id="btnUA" onclick="setLang('ua')">🇺🇦 Українська</button>
  </div>

  <nav class="tabs" id="dayTabs"></nav>

  <table class="schedule-table">
    <thead>
      <tr>
        <th class="nr">#</th>
        <th class="time" id="thTime">Godziny</th>
        <th id="thSubj">Przedmiot</th>
        <th class="room" id="thRoom">Sala</th>
      </tr>
    </thead>
    <tbody id="scheduleBody"></tbody>
  </table>

  <div class="info-panel" id="infoPanel">
    <button class="close-btn" onclick="closeInfo()">✕</button>
    <h2 id="infoPanelTitle"></h2>
    <dl class="book-info" id="bookInfo"></dl>
    <div class="nav-links" id="navLinks"></div>
  </div>

  <footer class="hub-footer">
    <p><a href="index.html" id="footerHome">← EduMost · Головна</a></p>
    <p style="margin-top:.3rem">SP3 Poznań · 2026/2027</p>
  </footer>
</div>

<script src="data/schedule.js"></script>
<script>
const TIMES = EduMostSchedule.TIMES;
const DAYS = EduMostSchedule.DAYS;
const SUBJ = EduMostSchedule.SUBJ;
const BOOKS = EduMostSchedule.BOOKS;
const SUBJECT_PAGE = EduMostSchedule.SUBJECT_PAGE;
const SCHEDULE = EduMostSchedule.SCHEDULE;

let lang = localStorage.getItem("edumost-lang") === "pl" ? "pl" : "ua";
let currentDay = new Date().getDay(); // 0=Sun
if (currentDay === 0 || currentDay === 6) currentDay = 1;
else currentDay = currentDay; // 1=Mon

function setLang(l) {
  lang = l;
  localStorage.setItem("edumost-lang", l);
  document.getElementById("btnPL").classList.toggle("active", l==="pl");
  document.getElementById("btnUA").classList.toggle("active", l==="ua");
  document.getElementById("mainTitle").textContent =
    l==="pl" ? "Plan lekcji — klasa 5a" : "Розклад уроків — 5a клас";
  document.getElementById("mainSub").textContent =
    l==="pl" ? "Szkoła Podstawowa nr 3, Poznań · sala 27"
             : "Школа Основна № 3, Познань · кабінет 27";
  document.getElementById("thTime").textContent = l==="pl" ? "Godziny" : "Час";
  document.getElementById("thSubj").textContent = l==="pl" ? "Przedmiot" : "Предмет";
  document.getElementById("thRoom").textContent = l==="pl" ? "Sala" : "Каб.";
  document.getElementById("backLink").textContent =
    l==="pl" ? "← EduMost · Strona główna" : "← EduMost · Головна";
  document.getElementById("footerHome").textContent =
    l==="pl" ? "← EduMost · Strona główna" : "← EduMost · Головна";
  renderTabs();
  renderDay(currentDay - 1);
  closeInfo();
}

function renderTabs() {
  const c = document.getElementById("dayTabs");
  const jsDay = new Date().getDay();
  c.innerHTML = DAYS[lang].map((name, i) => {
    const isActive = (i + 1) === currentDay;
    const isToday = (i + 1) === jsDay;
    return `<button class="${isActive?"active":""} ${isToday?"today":""}"
      onclick="currentDay=${i+1};renderTabs();renderDay(${i});closeInfo()">${name}</button>`;
  }).join("");
}

function renderDay(di) {
  const lessons = SCHEDULE[di];
  let last = -1;
  lessons.forEach(function (l, i) { if (l) last = i; });
  const tbody = document.getElementById("scheduleBody");
  const emptyLabel = lang === "pl" ? "—" : "—";
  tbody.innerHTML = lessons.slice(0, last + 1).map((l, i) => {
    if (!l) {
      return `<tr class="slot-empty">
        <td class="nr">${i + 1}</td>
        <td class="time">${TIMES[i] || ""}</td>
        <td class="subj">${emptyLabel}</td>
        <td class="room"></td>
      </tr>`;
    }
    const s = SUBJ[l.s];
    const name = s ? (s.icon + " " + s[lang]) : l.s;
    const hasBook = !!BOOKS[l.s];
    const cell = hasBook
      ? `<a href="#" onclick="showInfo('${l.s}');return false">${name}</a>`
      : name;
    return `<tr>
      <td class="nr">${i + 1}</td>
      <td class="time">${TIMES[i] || ""}</td>
      <td class="subj">${cell}</td>
      <td class="room">${l.r || ""}</td>
    </tr>`;
  }).join("");
}

function showInfo(key) {
  const b = BOOKS[key];
  const s = SUBJ[key];
  if (!b) return;
  const p = document.getElementById("infoPanel");
  document.getElementById("infoPanelTitle").textContent =
    s.icon + " " + s[lang] + (lang==="ua" ? " / "+s.pl : " / "+s.ua);

  const items = [
    [lang==="pl"?"Podręcznik":"Підручник", `«${b.title}»`],
    [lang==="pl"?"Autor":"Автор", b.author],
    [lang==="pl"?"Wydawnictwo":"Видавництво", b.publisher],
    [lang==="pl"?"Numer dopuszczenia":"Номер допуску", b.nr]
  ];
  if (b.ua_desc) {
    items.push(["🇺🇦 Підказка", b.ua_desc]);
  }
  document.getElementById("bookInfo").innerHTML = items.map(([dt,dd]) =>
    `<dt>${dt}:</dt><dd${dt.includes("Підказка")?' class="ua"':''}>${dd}</dd>`
  ).join("");

  const nl = document.getElementById("navLinks");
  const page = SUBJECT_PAGE[key];
  nl.innerHTML = page
    ? `<a href="${page}">${lang==="pl"?"Otwórz przedmiot →":"Відкрити предмет →"}</a>`
    : "";
  p.classList.add("open");
  p.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function closeInfo() {
  document.getElementById("infoPanel").classList.remove("open");
}

// init
setLang(lang);
</script>
</body>
</html>

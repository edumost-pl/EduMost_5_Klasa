<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Kwadrat jako szczegolny prostokat">
  <rect width="640" height="260" rx="18" fill="#FAF5FF"/>
  <rect x="40" y="50" width="200" height="120" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
  <text x="140" y="40" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#1565C0">PROSTOKĄT</text>
  <text x="140" y="118" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#37474F">4 kąty 90°</text>
  <text x="140" y="136" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#546E7A">boki naprzeciwległe równe</text>
  <path d="M260 110 H300" stroke="#FF9800" stroke-width="4" stroke-linecap="round"/>
  <polygon points="300,102 316,110 300,118" fill="#FF9800"/>
  <text x="288" y="95" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#EF6C00">a co jeśli…?</text>
  <rect x="340" y="50" width="120" height="120" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
  <text x="400" y="40" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#2E7D32">KWADRAT</text>
  <text x="400" y="112" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#37474F">wszystkie</text>
  <text x="400" y="130" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#37474F">boki równe</text>
  <g transform="translate(40,195)">
    <rect x="0" y="0" width="70" height="42" rx="3" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="35" y="26" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#1565C0">okno</text>
    <rect x="90" y="4" width="34" height="34" rx="2" fill="#CE93D8" stroke="#6A32A0" stroke-width="2"/>
    <text x="107" y="52" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6A32A0">płytka</text>
    <rect x="150" y="6" width="52" height="30" rx="2" fill="#FFE0B2" stroke="#FF9800" stroke-width="2"/>
    <text x="176" y="52" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#EF6C00">zeszyt</text>
    <rect x="230" y="10" width="80" height="24" rx="2" fill="#B2DFDB" stroke="#00897B" stroke-width="2"/>
    <text x="270" y="52" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#00695C">stół</text>
  </g>
  <rect x="480" y="55" width="140" height="110" rx="12" fill="#FFF8E1" stroke="#FFB300" stroke-width="2"/>
  <text x="550" y="95" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#6A32A0">kwadrat</text>
  <text x="550" y="115" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#546E7A">= szczególny</text>
  <text x="550" y="135" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#546E7A">prostokąt</text>
</svg>
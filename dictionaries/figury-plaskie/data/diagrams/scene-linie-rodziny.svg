<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Punkt, odcinek, prosta, półprosta">
  <rect width="640" height="220" rx="18" fill="#E3F2FD"/>
  <circle cx="70" cy="70" r="10" fill="#6A32A0"/>
  <text x="70" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#6A32A0">punkt</text>
  <text x="70" y="128" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#546E7A">A</text>
  <line x1="140" y1="70" x2="260" y2="70" stroke="#00BCD4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="70" r="7" fill="#00838F"/>
  <circle cx="260" cy="70" r="7" fill="#00838F"/>
  <text x="140" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#00838F" font-family="Segoe UI,sans-serif">C</text>
  <text x="260" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#00838F" font-family="Segoe UI,sans-serif">D</text>
  <text x="200" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#00838F">odcinek</text>
  <text x="200" y="128" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#546E7A">dwa końce</text>
  <line x1="300" y1="70" x2="430" y2="70" stroke="#FF9800" stroke-width="5" stroke-linecap="round"/>
  <polygon points="430,62 448,70 430,78" fill="#FF9800"/>
  <circle cx="300" cy="70" r="7" fill="#EF6C00"/>

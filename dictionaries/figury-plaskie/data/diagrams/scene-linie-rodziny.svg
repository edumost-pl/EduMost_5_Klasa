  <text x="370" y="110" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#EF6C00">półprosta</text>
  <text x="370" y="128" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#546E7A">początek, bez końca</text>
  <line x1="40" y1="175" x2="600" y2="175" stroke="#43A047" stroke-width="5"/>
